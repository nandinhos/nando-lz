# Configuração do GitGuardian / ggshield.
#
# "postgres" é a SENHA PADRÃO DE DESENVOLVIMENTO do PostgreSQL, especificada no
# PRD (§5.5) e usada apenas localmente e no serviço efêmero do CI. NÃO é um
# segredo real: em produção/VPS a senha vai no .env (que nunca é versionado).
# Este ignore evita falso-positivo de "Generic Password" nessas 3 ocorrências
# (.env.example, .github/workflows/ci.yml, .github/workflows/auto-update.yml).
version: 2
secret:
  ignored-matches:
    - name: "PostgreSQL dev default (placeholder, não é segredo real)"
      match: postgres
    # Fixtures de teste em tests/Feature/SanityTest.php — valores forjados
    # apenas para satisfazer a validação de senha forte num banco efêmero.
    - name: "Senha-fixture dos testes do superadmin:create"
      match: Senha-Fake-De-Teste-123!
    - name: "Senha-fixture antiga (histórico v1.0.0)"
      match: Str0ngPass!2026

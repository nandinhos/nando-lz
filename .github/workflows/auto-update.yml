name: Auto Update

# Ciclo semanal do agente (PRD §6 Camada 2 / §7). Aplica patch/minor, roda os
# gates e abre uma PR candidata. O árbitro autônomo faz merge apenas depois do
# CI independente e da validação restrita do diff. Segunda 08:00 BRT = 11:00 UTC.
on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  # `gh workflow run ci.yml` (dispatch do gate no PR do agente) exige actions:write.
  actions: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: nando_lz_testing
      DB_USERNAME: postgres
      DB_PASSWORD: ""

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: nando_lz_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, pdo_pgsql
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Preparar ambiente
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
          php artisan key:generate

      - name: Criar branch de manutenção
        run: |
          git config user.name "nando-lz-bot"
          git config user.email "actions@users.noreply.github.com"
          git switch -c "maintenance/auto-update-$(date +%F)"

      - name: Rodar ciclo de atualização (§7.3)
        id: cycle
        continue-on-error: true
        run: bash scripts/update-stack.sh

      - name: Abrir PR candidata ou registrar falha
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DATE="$(date +%F)"
          BRANCH="maintenance/auto-update-$DATE"
          REPORT="docs/reports/auto-update/$DATE.md"

          # O relatório é gerado em TODO ciclo; sozinho ele não justifica PR.
          # Só abre PR se algo além de docs/reports/ mudou.
          if [ -z "$(git status --porcelain -- ':!docs/reports')" ]; then
            echo "Só o relatório mudou — nada a atualizar neste ciclo."
            exit 0
          fi

          # Classificação (§7.2): mexer em manifests, código ou workflow = REVIEW.
          LABELS="auto-update"

          # Labels podem não existir em forks/clones novos — bootstrap idempotente.
          gh label create "auto-update"          --color 1d76db --description "PR do ciclo automático" --force
          gh label create "needs-human-approval" --color d93f0b --description "Classe REVIEW — merge só humano (§7.2)" --force
          gh label create "autonomous-candidate" --color 0e8a16 --description "Candidata ao merge autônomo após todos os gates" --force
          gh label create "autonomy-blocked"     --color b60205 --description "Não atende a política de autonomia" --force
          gh label create "security"             --color ee0701 --description "Correção de segurança" --force

          git add -A
          git commit -m "chore(auto-update): ciclo $DATE"
          HEAD_SHA="$(git rev-parse HEAD)"

          if [ "${{ steps.cycle.outcome }}" = "success" && bash scripts/assert-autonomous-update.sh origin/main "$HEAD_SHA"; then
            LABELS="$LABELS,autonomous-candidate"
          else
            LABELS="$LABELS,needs-human-approval,autonomy-blocked"
          fi
          # --force-with-lease: re-run no mesmo dia sobrescreve a própria branch com segurança.
          git push --force-with-lease -u origin "$BRANCH"

          [ -f "$REPORT" ] || echo "Ciclo $DATE — relatório não gerado." > "$REPORT"

          ACTIONS_CAN_APPROVE="$(gh api "repos/${{ github.repository }}/actions/permissions/workflow" --jq '.can_approve_pull_request_reviews' 2>/dev/null || echo false)"
          if [ "$ACTIONS_CAN_APPROVE" != "true" ]; then
            echo "::error::A política do repositório não permite que o GitHub Actions crie/aprove Pull Requests. Habilite 'Allow GitHub Actions to create and approve pull requests' ou escolha outro token autorizado."
            exit 1
          fi

          # A política do repositório precisa permitir PRs criados por Actions.
          # Não trate erro de permissão como se fosse um PR já existente.
          PR_NUMBER="$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" --body-file "$REPORT"
            gh pr edit "$PR_NUMBER" --remove-label "autonomous-candidate" --remove-label "needs-human-approval" --remove-label "autonomy-blocked" || true
            gh pr edit "$PR_NUMBER" --add-label "$LABELS"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "Auto-update $DATE" \
              --body-file "$REPORT" \
              --label "$LABELS"
          fi

          # Push/PR feitos com GITHUB_TOKEN não disparam workflows (regra do
          # GitHub Actions) — dispara o gate universal explicitamente para o
          # PR não ficar preso em "Expected" nos required checks.
          gh workflow run ci.yml --ref "$BRANCH"

      - name: Abrir issue de falha se o ciclo quebrou (§9)
        if: ${{ always() && (steps.cycle.outcome != 'success' || steps.publish.outcome != 'success') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create "maintenance-failure" \
            --color b60205 \
            --description "Falha no ciclo de manutenção automática" \
            --force
          gh issue create \
            --title "maintenance-failure: ciclo $(date +%F)" \
            --label "maintenance-failure" \
            --body "O ciclo automático falhou. Resultado do ciclo: ${{ steps.cycle.outcome }}. Resultado da publicação: ${{ steps.publish.outcome }}. Veja o run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

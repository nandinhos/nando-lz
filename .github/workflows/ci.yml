name: CI

# Gate universal (PRD §6 Camada 3 / §8). Nenhum PR entra na main sem este verde.
on:
  push:
    branches: [main, 'maintenance/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nando_lz_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, pdo_pgsql
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Preparar .env
        run: cp .env.example .env

      - name: composer validate --strict
        run: composer validate --strict

      - name: composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Gerar APP_KEY
        run: php artisan key:generate

      - name: Pint (estilo de código)
        run: vendor/bin/pint --test

      - name: Migrations em banco limpo
        env:
          DB_DATABASE: nando_lz_testing
        run: php artisan migrate --force

      - name: Build de assets
        run: |
          npm ci
          npm run build

      - name: Pest (painéis, logout, superadmin, migrations)
        run: ./vendor/bin/pest

# auto-merge.yml — Mergeia PRs do agente automaticamente após CI verde
#
# Trigger: PR aberta (ou sincronizada) com label "auto-merge".
#
# Quem adiciona a label? O agente (scripts/update-stack.sh) quando o ciclo
# é AUTO-class (patch/minor/CVE/lock/dev-dep) e Pest+CI+build estão verdes.
#
# O que este workflow faz:
#   1. Verifica que CI (ci.yml) passou (status check "tests")
#   2. Verifica que PR tem label "auto-merge"
#   3. Faz merge tipo "squash" (mantém histórico limpo)
#   4. Remove branch de manutenção automaticamente
#
# Referência: PRD §11.3 (auto-update autônomo)
#
# Segurança: este workflow roda no GitHub, não no agent runner.
# O token aqui é o GITHUB_TOKEN do Actions (escopo apenas do repo).

name: Auto-Merge

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, reopened, opened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.labels.*.name == 'auto-merge'
    runs-on: ubuntu-latest
    steps:
      - name: Verificar se CI passou
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: pr.head.sha,
            });
            const requiredChecks = ['tests'];
            const failed = checks.check_runs.filter(
              (c) => requiredChecks.includes(c.name) && c.conclusion !== 'success'
            );
            if (failed.length > 0) {
              core.info(`CI ainda não passou: ${failed.map(c => c.name).join(', ')}`);
              return;
            }
            core.info('CI verde, fazendo merge squash...');
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              merge_method: 'squash',
            });
            core.info(`PR #${pr.number} mergeado.`);

name: Autonomous merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: autonomous-merge
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout confiável da main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Selecionar, validar e mesclar candidatos seguros
        shell: bash
        run: |
          set -Eeuo pipefail

          ensure_label() {
            local name="$1" color="$2" description="$3"
            gh api --method POST "repos/$REPOSITORY/labels" \
              -f name="$name" \
              -f color="$color" \
              -f description="$description" >/dev/null 2>&1 ||
              gh api --method PATCH "repos/$REPOSITORY/labels/$name" \
                -f new_name="$name" \
                -f color="$color" \
                -f description="$description" >/dev/null
          }

          ensure_label auto-update 0e8a16 'Atualização recorrente da stack'
          ensure_label dependencies 0366d6 'Alteração de dependências'
          ensure_label autonomous-candidate 5319e7 'Candidato elegível para merge autônomo'
          ensure_label autonomy-blocked b60205 'Candidato autônomo bloqueado por política'

          allowed_lock_candidate() {
            local pr="$1" head_sha files status path report_path='' has_lock=false
            head_sha="$(gh pr view "$pr" --repo "$REPOSITORY" --json headRefOid --jq .headRefOid)"
            files="$(gh api --paginate "repos/$REPOSITORY/pulls/$pr/files?per_page=100" --jq '.[] | "\(.status)\t\(.filename)"')"

            while IFS=$'\t' read -r status path; do
              [ -n "$path" ] || continue
              case "$status" in added|modified) ;; *) return 1 ;; esac
              case "$path" in
                composer.lock|package-lock.json) has_lock=true ;;
                README.md) ;;
                docs/reports/auto-update/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].md) report_path="$path" ;;
                *) return 1 ;;
              esac
            done <<< "$files"

            [ "$has_lock" = true ] && [ -n "$report_path" ] || return 1
            gh api "repos/$REPOSITORY/contents/$report_path?ref=$head_sha" --jq .content \
              | tr -d '\n' \
              | base64 --decode \
              | grep --fixed-strings --quiet -- '- Resultado geral: ✅ verde'
          }

          allowed_actions_candidate() {
            local pr="$1" files patch line has_file=false in_diff=false
            files="$(gh api --paginate "repos/$REPOSITORY/pulls/$pr/files?per_page=100" --jq '.[] | "\(.status)\t\(.filename)"')"
            while IFS=$'\t' read -r status path; do
              [ -n "$path" ] || continue
              [ "$status" = modified ] || return 1
              [[ "$path" =~ ^\.github/workflows/[A-Za-z0-9._-]+\.ya?ml$ ]] || return 1
              has_file=true
            done <<< "$files"
            [ "$has_file" = true ] || return 1

            patch="$(gh pr diff "$pr" --repo "$REPOSITORY" --patch)"
            while IFS= read -r line; do
              case "$line" in
                'diff --git '*) in_diff=true; continue ;;
                *) [ "$in_diff" = true ] || continue ;;
              esac

              case "$line" in
                '+++'*|'---'*|'@@'*|'index '*|'') continue ;;
                ' '*) continue ;;
                +*|-*)
                  [[ "$line" =~ ^[+-][[:space:]]*-[[:space:]]*uses:[[:space:]]*[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+@[A-Za-z0-9_.:-]+[[:space:]]*$ ]] || return 1
                  ;;
                *) return 1 ;;
              esac
            done <<< "$patch"

            [ "$in_diff" = true ]
          }

          all_checks_green() {
            local pr="$1" head_sha checks
            head_sha="$(gh pr view "$pr" --repo "$REPOSITORY" --json headRefOid --jq .headRefOid)"
            checks="$(gh api --paginate "repos/$REPOSITORY/commits/$head_sha/check-runs?per_page=100" --jq '.check_runs')"
            jq -e '
              length > 0 and
              all(.[]; .status == "COMPLETED" and .conclusion == "SUCCESS") and
              ([.[].name] | index("PHP 8.3")) and
              ([.[].name] | index("PHP 8.4")) and
              ([.[].name] | index("Dependency audit")) and
              ([.[].name] | index("GitGuardian Security Checks"))
            ' <<< "$checks" >/dev/null
          }

          mark_blocked() {
            local pr="$1" reason="$2"
            if gh pr view "$pr" --repo "$REPOSITORY" --json labels --jq '[.labels[].name] | index("autonomy-blocked") != null' | grep --fixed-strings --quiet true; then
              return
            fi
            gh api --method POST "repos/$REPOSITORY/issues/$pr/labels" -f 'labels[]=autonomy-blocked' >/dev/null
            gh issue create --repo "$REPOSITORY" \
              --title "autonomy-blocked: PR #$pr" \
              --label autonomy-blocked \
              --body "A PR #$pr não foi mesclada automaticamente. Motivo: $reason. A automação preservou a main e o deploy de produção sem alteração."
          }

          clear_blocked() {
            local pr="$1" issue
            if ! gh pr view "$pr" --repo "$REPOSITORY" --json labels --jq '[.labels[].name] | index("autonomy-blocked") != null' | grep --fixed-strings --quiet true; then
              return
            fi

            gh api --method DELETE "repos/$REPOSITORY/issues/$pr/labels/autonomy-blocked" >/dev/null
            while IFS= read -r issue; do
              [ -n "$issue" ] || continue
              gh api --method PATCH "repos/$REPOSITORY/issues/$issue" -f state=closed >/dev/null
            done < <(gh api "search/issues?q=repo:$REPOSITORY+is:issue+is:open+in:title+autonomy-blocked:+PR+%23$pr" --jq '.items[].number')
          }

          prs=()
          if [ "$EVENT_NAME" = workflow_run ] && [ -n "$HEAD_SHA" ]; then
            while IFS= read -r pr; do prs+=("$pr"); done < <(gh api "repos/$REPOSITORY/commits/$HEAD_SHA/pulls" --jq '.[] | select(.state == "open") | .number')
          else
            while IFS= read -r pr; do prs+=("$pr"); done < <(gh pr list --repo "$REPOSITORY" --base main --state open --json number --jq '.[].number')
          fi

          for pr in "${prs[@]:-}"; do
            metadata="$(gh pr view "$pr" --repo "$REPOSITORY" --json isDraft,baseRefName,headRefName,headRefOid,author,mergeStateStatus)"
            draft="$(jq -r .isDraft <<< "$metadata")"
            base="$(jq -r .baseRefName <<< "$metadata")"
            branch="$(jq -r .headRefName <<< "$metadata")"
            author="$(jq -r .author.login <<< "$metadata")"
            merge_state="$(jq -r .mergeStateStatus <<< "$metadata")"
            head_sha="$(jq -r .headRefOid <<< "$metadata")"

            [ "$draft" = false ] && [ "$base" = main ] || continue
            candidate_type=''
            if [ "$author" = 'github-actions[bot]' ] && [[ "$branch" =~ ^maintenance/auto-update-[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              allowed_lock_candidate "$pr" && candidate_type='locks'
            elif { [ "$author" = 'dependabot[bot]' ] || [ "$author" = 'app/dependabot' ]; } && [[ "$branch" =~ ^dependabot/ ]]; then
              allowed_actions_candidate "$pr" && candidate_type='actions'
            else
              continue
            fi

            if [ -z "$candidate_type" ]; then
              mark_blocked "$pr" 'diff fora do escopo permitido'
              continue
            fi

            clear_blocked "$pr"

            if ! all_checks_green "$pr"; then
              continue
            fi

            if [ "$merge_state" = BEHIND ]; then
              if ! gh pr update-branch "$pr" --repo "$REPOSITORY" --rebase; then
                mark_blocked "$pr" 'não foi possível rebasear sobre a main atual'
              else
                gh workflow run ci.yml --repo "$REPOSITORY" --ref "$branch"
              fi
              continue
            fi

            [ "$merge_state" = CLEAN ] || continue
            gh pr merge "$pr" --repo "$REPOSITORY" --rebase --delete-branch --match-head-commit "$head_sha"
          done
